<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templates - IndyCar Telemetry</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* ================================================================ *
     *  Layout -- CSS Grid
     * ================================================================ */
    .tmpl-layout {
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 260px 1fr;
      grid-template-areas:
        "topbar  topbar"
        "sidebar main";
      height: 100vh;
      width: 100vw;
    }

    /* ================================================================ *
     *  Top Bar
     * ================================================================ */
    .top-bar {
      grid-area: topbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
      min-height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .app-title {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .app-title span {
      color: var(--accent);
    }

    .top-bar-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-bar-nav a {
      font-size: 0.825rem;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }

    .top-bar-nav a:hover {
      color: var(--text);
      background: var(--surface-alt);
    }

    .top-bar-nav a.active {
      color: var(--accent);
      background: var(--accent-light);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .user-badge .user-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .user-badge .user-name {
      color: var(--text);
      font-weight: 500;
    }

    .user-badge .user-role {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #logoutBtn {
      padding: 6px 14px;
      font-size: 0.8rem;
    }

    /* ================================================================ *
     *  Left Sidebar -- Folder Tree
     * ================================================================ */
    .tmpl-sidebar {
      grid-area: sidebar;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .tmpl-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .tmpl-sidebar-header h2 {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .tmpl-sidebar-actions {
      display: flex;
      gap: 6px;
    }

    .tmpl-sidebar-actions .btn {
      padding: 4px 10px;
      font-size: 0.75rem;
    }

    .tmpl-folder-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    /* Folder item in tree */
    .tmpl-folder-item {
      margin-bottom: 1px;
    }

    .tmpl-folder-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
      user-select: none;
    }

    .tmpl-folder-row:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    .tmpl-folder-row.selected {
      background: var(--accent-light);
      color: var(--accent);
    }

    .tmpl-folder-chevron {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--transition);
      flex-shrink: 0;
    }

    .tmpl-folder-chevron.open {
      transform: rotate(90deg);
    }

    .tmpl-folder-chevron svg {
      width: 12px;
      height: 12px;
    }

    .tmpl-folder-chevron.empty {
      visibility: hidden;
    }

    .tmpl-folder-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    .tmpl-folder-row.selected .tmpl-folder-icon {
      opacity: 1;
    }

    .tmpl-folder-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tmpl-folder-actions {
      display: none;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .tmpl-folder-row:hover .tmpl-folder-actions {
      display: flex;
    }

    .tmpl-folder-action-btn {
      padding: 2px 4px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.75rem;
      line-height: 1;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
    }

    .tmpl-folder-action-btn:hover {
      color: var(--text);
      background: var(--surface-alt);
    }

    .tmpl-folder-action-btn.danger:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .tmpl-folder-action-btn svg {
      width: 12px;
      height: 12px;
    }

    .tmpl-folder-children {
      padding-left: 16px;
      display: none;
    }

    .tmpl-folder-children.open {
      display: block;
    }

    /* ================================================================ *
     *  Main Area
     * ================================================================ */
    .tmpl-main {
      grid-area: main;
      display: flex;
      flex-direction: column;
      background: var(--deep-space);
      overflow: hidden;
    }

    /* -- Toolbar: breadcrumb + search + new button -- */
    .tmpl-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }

    .tmpl-toolbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1;
    }

    .tmpl-toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .tmpl-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 0;
      flex-shrink: 1;
      overflow: hidden;
    }

    .tmpl-breadcrumb-item {
      cursor: pointer;
      white-space: nowrap;
      transition: color var(--transition);
    }

    .tmpl-breadcrumb-item:hover {
      color: var(--text);
    }

    .tmpl-breadcrumb-item.current {
      color: var(--text);
      font-weight: 600;
      cursor: default;
    }

    .tmpl-breadcrumb-sep {
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .tmpl-search-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .tmpl-search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .tmpl-search {
      padding: 6px 12px 6px 32px;
      width: 240px;
      font-size: 0.8rem;
      background: var(--deep-space);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      transition: border-color var(--transition);
    }

    .tmpl-search:focus {
      border-color: var(--accent);
    }

    .tmpl-search::placeholder {
      color: var(--text-dim);
    }

    /* -- Template Grid -- */
    .tmpl-grid-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .tmpl-grid {
      flex: 1;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .tmpl-card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
      overflow: hidden;
      position: relative;
    }

    .tmpl-card:hover {
      border-color: var(--accent);
      background: var(--surface-alt);
    }

    .tmpl-card-dots {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 2px 4px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      border-radius: var(--radius-sm);
      display: none;
      align-items: center;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .tmpl-card:hover .tmpl-card-dots {
      display: flex;
    }

    .tmpl-card-dots:hover {
      color: var(--text);
      background: rgba(0, 0, 0, 0.8);
    }

    .tmpl-card-thumb {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-alt);
      overflow: hidden;
      position: relative;
    }

    .tmpl-card-thumb svg {
      width: 40px;
      height: 40px;
      color: var(--text-dim);
      opacity: 0.5;
    }

    .tmpl-card-info {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .tmpl-card-name {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tmpl-card-meta {
      font-size: 0.65rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tmpl-type-badge {
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: 999px;
      white-space: nowrap;
    }

    /* -- Empty State -- */
    .tmpl-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      grid-column: 1 / -1;
    }

    .tmpl-empty-state svg {
      width: 36px;
      height: 36px;
      opacity: 0.3;
    }

    /* ================================================================ *
     *  Context Menu
     * ================================================================ */
    .tmpl-context-menu {
      position: fixed;
      z-index: 9000;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 0;
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: none;
    }

    .tmpl-context-menu.show {
      display: block;
    }

    .tmpl-context-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      transition: background var(--transition);
    }

    .tmpl-context-item:hover {
      background: var(--surface-alt);
    }

    .tmpl-context-item.danger {
      color: var(--danger);
    }

    .tmpl-context-item svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .tmpl-context-separator {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* ================================================================ *
     *  Move-to-folder Modal list
     * ================================================================ */
    .tmpl-move-folder-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 240px;
      overflow-y: auto;
      margin-top: 8px;
    }

    .tmpl-move-folder-option {
      padding: 8px 12px;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background var(--transition);
    }

    .tmpl-move-folder-option:hover {
      background: var(--surface-alt);
    }

    .tmpl-move-folder-option.selected {
      background: var(--accent-light);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="tmpl-layout">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div class="app-title">Indy<span>Car</span> Telemetry</div>
        <nav class="top-bar-nav">
          <a href="/dashboard">Dashboard</a>
          <a href="/templates" class="active">Templates</a>
          <a href="/graphics-control">Live Rundowns</a>
          <a href="/drivers">Drivers</a>
          <a href="/simulator">Simulator</a>
          <a href="/library">Library</a>
        </nav>
      </div>
      <div class="top-bar-right">
        <div class="user-badge" id="userBadge">
          <div class="user-avatar" id="userAvatar">--</div>
          <div>
            <div class="user-name" id="userName">---</div>
            <div class="user-role" id="userRole">---</div>
          </div>
        </div>
        <button class="btn btn-sm" id="logoutBtn">Logout</button>
      </div>
    </header>

    <!-- Left Sidebar: Folder Tree -->
    <aside class="tmpl-sidebar">
      <div class="tmpl-sidebar-header">
        <h2>Folders</h2>
        <div class="tmpl-sidebar-actions">
          <button class="btn btn-sm btn-primary" id="btnNewFolder">+ Folder</button>
        </div>
      </div>
      <div class="tmpl-folder-tree" id="folderTree">
        <!-- Root item + recursive folders rendered by JS -->
      </div>
    </aside>

    <!-- Main Area -->
    <main class="tmpl-main">
      <!-- Toolbar: breadcrumb + search + new template button -->
      <div class="tmpl-toolbar">
        <div class="tmpl-toolbar-left">
          <div class="tmpl-breadcrumb" id="breadcrumb">
            <span class="tmpl-breadcrumb-item current">All Templates</span>
          </div>
        </div>
        <div class="tmpl-toolbar-right">
          <div class="tmpl-search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" class="tmpl-search" id="searchInput" placeholder="Search templates...">
          </div>
          <button class="btn btn-sm btn-primary" id="btnNewTemplate">+ New Template</button>
        </div>
      </div>

      <!-- Template grid -->
      <div class="tmpl-grid-area">
        <div class="tmpl-grid" id="templateGrid">
          <div class="tmpl-empty-state" id="templateEmpty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            <span>No templates in this folder</span>
            <span style="font-size:0.75rem; color:var(--text-dim)">Click "+ New Template" to get started</span>
          </div>
        </div>
      </div>
    </main>

  </div>

  <!-- Context Menu -->
  <div class="tmpl-context-menu" id="contextMenu"></div>

  <script type="module" src="/js/templates/main.js"></script>
</body>
</html>
