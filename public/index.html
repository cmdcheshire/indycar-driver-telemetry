<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndyCar Telemetry Overlay</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .login-header p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    .login-form .input {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
    }
    .login-error {
      color: var(--danger);
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }
    .login-form .btn-primary {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>IndyCar Telemetry</h1>
        <p>Overlay Control System</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="input-group">
          <label for="username">Username</label>
          <input class="input" type="text" id="username" autocomplete="username" required autofocus />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" autocomplete="current-password" required />
        </div>
        <div class="login-error" id="loginError"></div>
        <button class="btn btn-primary" type="submit" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { login, isAuthenticated } from '/js/modules/auth.js';

    if (isAuthenticated()) {
      window.location.href = '/dashboard';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        await login(
          document.getElementById('username').value,
          document.getElementById('password').value
        );
        window.location.href = '/dashboard';
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
