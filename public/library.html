<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphics Library - IndyCar Telemetry</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* ================================================================ *
     *  Layout -- CSS Grid
     * ================================================================ */
    .lib-layout {
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 260px 1fr;
      grid-template-areas:
        "topbar  topbar"
        "sidebar main";
      height: 100vh;
      width: 100vw;
    }

    /* ================================================================ *
     *  Top Bar
     * ================================================================ */
    .top-bar {
      grid-area: topbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
      min-height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .app-title {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .app-title span {
      color: var(--accent);
    }

    .top-bar-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-bar-nav a {
      font-size: 0.825rem;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }

    .top-bar-nav a:hover {
      color: var(--text);
      background: var(--surface-alt);
    }

    .top-bar-nav a.active {
      color: var(--accent);
      background: var(--accent-light);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .user-badge .user-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .user-badge .user-name {
      color: var(--text);
      font-weight: 500;
    }

    .user-badge .user-role {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #logoutBtn {
      padding: 6px 14px;
      font-size: 0.8rem;
    }

    /* ================================================================ *
     *  Left Sidebar -- Folder Tree
     * ================================================================ */
    .lib-sidebar {
      grid-area: sidebar;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .lib-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .lib-sidebar-header h2 {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .lib-sidebar-actions {
      display: flex;
      gap: 6px;
    }

    .lib-sidebar-actions .btn {
      padding: 4px 10px;
      font-size: 0.75rem;
    }

    .lib-folder-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    /* Folder item in tree */
    .lib-folder-item {
      margin-bottom: 1px;
    }

    .lib-folder-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
      user-select: none;
    }

    .lib-folder-row:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    .lib-folder-row.selected {
      background: var(--accent-light);
      color: var(--accent);
    }

    .lib-folder-chevron {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--transition);
      flex-shrink: 0;
    }

    .lib-folder-chevron.open {
      transform: rotate(90deg);
    }

    .lib-folder-chevron svg {
      width: 12px;
      height: 12px;
    }

    .lib-folder-chevron.empty {
      visibility: hidden;
    }

    .lib-folder-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    .lib-folder-row.selected .lib-folder-icon {
      opacity: 1;
    }

    .lib-folder-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lib-folder-actions {
      display: none;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .lib-folder-row:hover .lib-folder-actions {
      display: flex;
    }

    .lib-folder-action-btn {
      padding: 2px 4px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.75rem;
      line-height: 1;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
    }

    .lib-folder-action-btn:hover {
      color: var(--text);
      background: var(--surface-alt);
    }

    .lib-folder-action-btn.danger:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .lib-folder-action-btn svg {
      width: 12px;
      height: 12px;
    }

    .lib-folder-children {
      padding-left: 16px;
      display: none;
    }

    .lib-folder-children.open {
      display: block;
    }

    .lib-folder-row.drag-over {
      background: var(--accent-light);
      outline: 1px dashed var(--accent);
    }

    /* ================================================================ *
     *  Main Area
     * ================================================================ */
    .lib-main {
      grid-area: main;
      display: flex;
      flex-direction: column;
      background: var(--deep-space);
      overflow: hidden;
    }

    /* ── Toolbar: breadcrumb + search ── */
    .lib-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }

    .lib-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 0;
      flex-shrink: 1;
      overflow: hidden;
    }

    .lib-breadcrumb-item {
      cursor: pointer;
      white-space: nowrap;
      transition: color var(--transition);
    }

    .lib-breadcrumb-item:hover {
      color: var(--text);
    }

    .lib-breadcrumb-item.current {
      color: var(--text);
      font-weight: 600;
      cursor: default;
    }

    .lib-breadcrumb-sep {
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .lib-search-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .lib-search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .lib-search {
      padding: 6px 12px 6px 32px;
      width: 240px;
      font-size: 0.8rem;
      background: var(--deep-space);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      transition: border-color var(--transition);
    }

    .lib-search:focus {
      border-color: var(--accent);
    }

    .lib-search::placeholder {
      color: var(--text-dim);
    }

    /* ── Asset Grid ── */
    .lib-asset-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .lib-asset-grid {
      flex: 1;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .lib-asset-card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
      overflow: hidden;
      position: relative;
    }

    .lib-asset-card:hover {
      border-color: var(--accent);
      background: var(--surface-alt);
    }

    .lib-asset-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .lib-asset-thumb {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      overflow: hidden;
      position: relative;
    }

    .lib-asset-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .lib-asset-thumb-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text-dim);
    }

    .lib-asset-thumb-icon svg {
      width: 32px;
      height: 32px;
      opacity: 0.5;
    }

    .lib-asset-thumb-icon .font-preview {
      font-size: 2rem;
      font-weight: 700;
      opacity: 0.6;
      color: var(--text-muted);
    }

    .lib-asset-thumb-icon .file-ext {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.5;
    }

    .lib-asset-info {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .lib-asset-name {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lib-asset-meta {
      font-size: 0.65rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lib-asset-dots {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 2px 4px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      border-radius: var(--radius-sm);
      display: none;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .lib-asset-card:hover .lib-asset-dots {
      display: flex;
    }

    .lib-asset-dots:hover {
      color: var(--text);
      background: rgba(0, 0, 0, 0.8);
    }

    /* ── Empty State ── */
    .lib-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      grid-column: 1 / -1;
    }

    .lib-empty-state svg {
      width: 36px;
      height: 36px;
      opacity: 0.3;
    }

    /* ── Upload Zone ── */
    .lib-upload-zone {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .lib-upload-zone:hover {
      background: var(--surface-alt);
    }

    .lib-upload-zone.drag-over {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .lib-upload-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 24px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      width: 100%;
      transition: all var(--transition);
    }

    .lib-upload-zone.drag-over .lib-upload-inner {
      border-color: var(--accent);
    }

    .lib-upload-inner svg {
      width: 24px;
      height: 24px;
      color: var(--text-dim);
    }

    .lib-upload-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .lib-upload-text strong {
      color: var(--accent);
    }

    .lib-upload-hint {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .lib-upload-input {
      display: none;
    }

    /* ── Upload Progress ── */
    .lib-upload-progress {
      display: none;
      width: 100%;
      padding: 8px 0;
    }

    .lib-upload-progress.active {
      display: block;
    }

    .lib-upload-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .lib-upload-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .lib-upload-status {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: center;
    }

    /* ================================================================ *
     *  Context Menu
     * ================================================================ */
    .lib-context-menu {
      position: fixed;
      z-index: 9000;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 0;
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: none;
    }

    .lib-context-menu.show {
      display: block;
    }

    .lib-context-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      transition: background var(--transition);
    }

    .lib-context-item:hover {
      background: var(--surface-alt);
    }

    .lib-context-item.danger {
      color: var(--danger);
    }

    .lib-context-item svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .lib-context-separator {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* ================================================================ *
     *  Asset Detail Overlay
     * ================================================================ */
    .lib-detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 8000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms;
    }

    .lib-detail-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .lib-detail-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      min-width: 440px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .lib-detail-preview {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .lib-detail-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .lib-detail-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      word-break: break-all;
    }

    .lib-detail-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .lib-detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .lib-detail-label {
      color: var(--text-muted);
    }

    .lib-detail-value {
      color: var(--text);
      font-weight: 500;
    }

    .lib-detail-url {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .lib-detail-url input {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--text-muted);
      background: var(--deep-space);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
    }

    .lib-detail-url button {
      padding: 6px 12px;
      font-size: 0.75rem;
    }

    .lib-detail-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ================================================================ *
     *  Move-to-folder Modal list
     * ================================================================ */
    .lib-move-folder-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 240px;
      overflow-y: auto;
      margin-top: 8px;
    }

    .lib-move-folder-option {
      padding: 8px 12px;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background var(--transition);
    }

    .lib-move-folder-option:hover {
      background: var(--surface-alt);
    }

    .lib-move-folder-option.selected {
      background: var(--accent-light);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="lib-layout">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div class="app-title">Indy<span>Car</span> Telemetry</div>
        <nav class="top-bar-nav">
          <a href="/dashboard">Dashboard</a>
          <a href="/templates">Templates</a>
          <a href="/graphics-control">Live Rundowns</a>
          <a href="/drivers">Drivers</a>
          <a href="/simulator">Simulator</a>
          <a href="/library" class="active">Library</a>
        </nav>
      </div>
      <div class="top-bar-right">
        <div class="user-badge" id="userBadge">
          <div class="user-avatar" id="userAvatar">--</div>
          <div>
            <div class="user-name" id="userName">---</div>
            <div class="user-role" id="userRole">---</div>
          </div>
        </div>
        <button class="btn btn-sm" id="logoutBtn">Logout</button>
      </div>
    </header>

    <!-- Left Sidebar: Folder Tree -->
    <aside class="lib-sidebar">
      <div class="lib-sidebar-header">
        <h2>Folders</h2>
        <div class="lib-sidebar-actions">
          <button class="btn btn-sm btn-primary" id="btnNewFolder">+ Folder</button>
        </div>
      </div>
      <div class="lib-folder-tree" id="folderTree">
        <!-- Root item (always visible) -->
      </div>
    </aside>

    <!-- Main Area -->
    <main class="lib-main">
      <!-- Toolbar: breadcrumb + search -->
      <div class="lib-toolbar">
        <div class="lib-breadcrumb" id="breadcrumb">
          <span class="lib-breadcrumb-item current">All Files</span>
        </div>
        <div class="lib-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" class="lib-search" id="searchInput" placeholder="Search assets...">
        </div>
        <button class="btn btn-sm" id="btnRescan" title="Re-scan disk for orphaned files" style="white-space:nowrap;font-size:0.75rem;padding:6px 12px;border:1px solid var(--border);background:var(--surface-alt,var(--surface));color:var(--text-muted);border-radius:4px;cursor:pointer;">Re-scan</button>
      </div>

      <!-- Asset grid + upload zone -->
      <div class="lib-asset-area">
        <div class="lib-asset-grid" id="assetGrid">
          <div class="lib-empty-state" id="assetEmpty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
            <span>No assets in this folder</span>
            <span style="font-size:0.75rem; color:var(--text-dim)">Upload files using the drop zone below</span>
          </div>
        </div>

        <!-- Upload Zone -->
        <div class="lib-upload-zone" id="uploadZone">
          <div class="lib-upload-inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div class="lib-upload-text">Drag & drop files here or <strong>click to browse</strong></div>
            <div class="lib-upload-hint">Images, fonts, videos, and other assets</div>
          </div>
          <div class="lib-upload-progress" id="uploadProgress">
            <div class="lib-upload-bar"><div class="lib-upload-bar-fill" id="uploadBarFill"></div></div>
            <div class="lib-upload-status" id="uploadStatus"></div>
          </div>
          <input type="file" class="lib-upload-input" id="uploadInput" multiple>
        </div>
      </div>
    </main>

  </div>

  <!-- Context Menu -->
  <div class="lib-context-menu" id="contextMenu"></div>

  <!-- Asset Detail Overlay -->
  <div class="lib-detail-overlay" id="detailOverlay">
    <div class="lib-detail-panel" id="detailPanel"></div>
  </div>

  <script type="module" src="/js/library/main.js"></script>
</body>
</html>
