<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>IndyCar Telemetry Overlay</title>

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', 'Roboto', sans-serif;
    }

    body {
      margin: 0;
    }

    #overlay-root {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Animations handled by GSAP — no CSS @keyframes needed */
  </style>
</head>
<body>
  <div id="overlay-root"></div>

  <script>
    // Extract the access token from the URL path: /overlay/{accessToken}
    window.__OVERLAY_ACCESS_TOKEN__ = window.location.pathname.split('/overlay/')[1] || '';
  </script>
  <script src="/js/vendor/gsap.min.js"></script>
  <script type="module">
    // Register motorsport easings before overlay modules load
    import { registerMotorsportEasings } from '/js/shared/motorsport-easings.js';
    registerMotorsportEasings();
  </script>
  <script type="module" src="/js/overlay/main.js"></script>
</body>
</html>
