<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>IndyCar Telemetry Overlay</title>

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', 'Roboto', sans-serif;
    }

    body {
      margin: 0;
    }

    #overlay-root {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* ── Enter Animations ── */
    @keyframes slideInLeft {
      from { transform: translateX(-100%); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    @keyframes slideInUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    @keyframes slideInDown {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    /* ── Exit Animations ── */
    @keyframes slideOutLeft {
      from { transform: translateX(0);     opacity: 1; }
      to   { transform: translateX(-100%); opacity: 0; }
    }

    @keyframes slideOutRight {
      from { transform: translateX(0);    opacity: 1; }
      to   { transform: translateX(100%); opacity: 0; }
    }

    @keyframes slideOutUp {
      from { transform: translateY(0);     opacity: 1; }
      to   { transform: translateY(-100%); opacity: 0; }
    }

    @keyframes slideOutDown {
      from { transform: translateY(0);    opacity: 1; }
      to   { transform: translateY(100%); opacity: 0; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    @keyframes scaleOut {
      from { transform: scale(1); opacity: 1; }
      to   { transform: scale(0); opacity: 0; }
    }

    /* ── Crossfade helper for value transitions ── */
    @keyframes crossfadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    @keyframes crossfadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Animation utility classes ── */
    .anim-slideInLeft   { animation: slideInLeft   0.4s ease-out forwards; }
    .anim-slideInRight  { animation: slideInRight  0.4s ease-out forwards; }
    .anim-slideInUp     { animation: slideInUp     0.4s ease-out forwards; }
    .anim-slideInDown   { animation: slideInDown   0.4s ease-out forwards; }
    .anim-fadeIn        { animation: fadeIn         0.3s ease-out forwards; }
    .anim-scaleIn       { animation: scaleIn       0.3s ease-out forwards; }

    .anim-slideOutLeft  { animation: slideOutLeft  0.4s ease-in forwards; }
    .anim-slideOutRight { animation: slideOutRight 0.4s ease-in forwards; }
    .anim-slideOutUp    { animation: slideOutUp    0.4s ease-in forwards; }
    .anim-slideOutDown  { animation: slideOutDown  0.4s ease-in forwards; }
    .anim-fadeOut       { animation: fadeOut        0.3s ease-in forwards; }
    .anim-scaleOut      { animation: scaleOut      0.3s ease-in forwards; }
  </style>
</head>
<body>
  <div id="overlay-root"></div>

  <script>
    // Extract the access token from the URL path: /overlay/{accessToken}
    window.__OVERLAY_ACCESS_TOKEN__ = window.location.pathname.split('/overlay/')[1] || '';
  </script>
  <script type="module" src="/js/overlay/main.js"></script>
</body>
</html>
