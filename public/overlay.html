<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>IndyCar Telemetry Overlay</title>

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', 'Roboto', sans-serif;
    }

    body {
      margin: 0;
    }

    .overlay-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      perspective: 1200px;
      transform-style: preserve-3d;
      display: none; /* Hidden by default, shown during TAKE ON */
    }

    /* ── Connection Status Indicator ── */
    #overlay-status {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #fff;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    #overlay-status.visible {
      opacity: 1;
    }
    #overlay-status .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #overlay-status.connecting {
      background: rgba(180, 130, 0, 0.85);
    }
    #overlay-status.connecting .status-dot {
      background: #ffc107;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    #overlay-status.disconnected {
      background: rgba(180, 30, 30, 0.85);
    }
    #overlay-status.disconnected .status-dot {
      background: #ff4444;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    #overlay-status.connected {
      background: rgba(30, 130, 50, 0.85);
    }
    #overlay-status.connected .status-dot {
      background: #4caf50;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Animations handled by GSAP — no CSS @keyframes needed */
  </style>
</head>
<body>
  <div id="overlay-status">
    <span class="status-dot"></span>
    <span class="status-text">Connecting...</span>
  </div>
  <!-- Dual-root architecture: one root can be on-air while the other is being cued -->
  <div id="overlay-root-a" class="overlay-root"></div>
  <div id="overlay-root-b" class="overlay-root"></div>

  <script>
    // Extract the access token from the URL path: /overlay/{accessToken}
    window.__OVERLAY_ACCESS_TOKEN__ = window.location.pathname.split('/overlay/')[1] || '';
  </script>
  <script src="/js/vendor/three.min.js"></script>
  <script src="/js/vendor/gsap.min.js"></script>
  <script type="module">
    // Register motorsport easings before overlay modules load
    import { registerMotorsportEasings } from '/js/shared/motorsport-easings.js';
    registerMotorsportEasings();
  </script>
  <script type="module" src="/js/overlay/main.js"></script>
</body>
</html>
