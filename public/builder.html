<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Builder - IndyCar Telemetry</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* ---- Layout ---- */
    .builder-layout {
      display: grid;
      grid-template-rows: 48px 1fr 180px;
      grid-template-columns: 240px 1fr 280px;
      grid-template-areas:
        "toolbar toolbar toolbar"
        "left-sidebar canvas right-sidebar"
        "layers layers layers";
      height: 100vh;
      width: 100vw;
    }

    /* ---- Top Toolbar ---- */
    .builder-toolbar {
      grid-area: toolbar;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .builder-toolbar .toolbar-left,
    .builder-toolbar .toolbar-center,
    .builder-toolbar .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .builder-toolbar .toolbar-left { flex: 0 0 auto; }
    .builder-toolbar .toolbar-center { flex: 1 1 auto; justify-content: center; }
    .builder-toolbar .toolbar-right { flex: 0 0 auto; }

    .toolbar-separator {
      width: 1px;
      height: 24px;
      background: var(--border);
    }

    .template-name-input {
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 4px 8px;
      min-width: 180px;
      text-align: center;
    }

    .template-name-input:hover { border-color: var(--border); }
    .template-name-input:focus { border-color: var(--accent); outline: none; }

    .zoom-display {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 48px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Left Sidebar ---- */
    .left-sidebar {
      grid-area: left-sidebar;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 12px;
    }

    .sidebar-section-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Tool buttons */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 1.1rem;
    }

    .tool-btn:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    .tool-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tool-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Template list */
    .template-list-container {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }

    .template-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    .template-list-item:hover { background: var(--surface-alt); }

    .template-list-item .tmpl-name {
      font-size: 0.85rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .template-list-item .tmpl-type {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-left: 8px;
    }

    .template-list-item .tmpl-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .template-list-item:hover .tmpl-actions { opacity: 1; }

    .tmpl-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 0.75rem;
      border-radius: var(--radius-sm);
    }

    .tmpl-action-btn:hover { color: var(--text); background: var(--border); }
    .tmpl-action-btn.delete:hover { color: var(--danger); }

    /* ---- Canvas Area ---- */
    .canvas-area {
      grid-area: canvas;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--deep-space);
      position: relative;
    }

    .canvas-wrapper {
      position: relative;
      transform-origin: center center;
    }

    .canvas-container {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      /* Checkerboard transparency pattern */
      background-image:
        linear-gradient(45deg, #1a1a2e 25%, transparent 25%),
        linear-gradient(-45deg, #1a1a2e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1a1a2e 75%),
        linear-gradient(-45deg, transparent 75%, #1a1a2e 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-color: #12121e;
      box-shadow: 0 0 0 1px var(--border);
    }

    /* Canvas element base */
    .canvas-element {
      position: absolute;
      cursor: move;
      user-select: none;
    }

    .canvas-element.locked {
      cursor: default;
      pointer-events: none;
    }

    .canvas-element.hidden-element {
      opacity: 0.25 !important;
    }

    /* Selection handles */
    .selection-outline {
      position: absolute;
      border: 2px solid var(--accent);
      pointer-events: none;
      z-index: 9000;
    }

    .selection-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      border: 2px solid var(--accent);
      border-radius: 2px;
      z-index: 9001;
      cursor: pointer;
      pointer-events: all;
    }

    .selection-handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
    .selection-handle.n  { top: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
    .selection-handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
    .selection-handle.e  { top: 50%; margin-top: -5px; right: -5px; cursor: ew-resize; }
    .selection-handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }
    .selection-handle.s  { bottom: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
    .selection-handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
    .selection-handle.w  { top: 50%; margin-top: -5px; left: -5px; cursor: ew-resize; }

    .rotation-handle {
      position: absolute;
      top: -28px;
      left: 50%;
      margin-left: -7px;
      width: 14px;
      height: 14px;
      background: white;
      border: 2px solid var(--accent);
      border-radius: 50%;
      z-index: 9001;
      cursor: grab;
      pointer-events: all;
    }

    .rotation-line {
      position: absolute;
      top: -16px;
      left: 50%;
      width: 2px;
      height: 16px;
      background: var(--accent);
      margin-left: -1px;
      pointer-events: none;
      z-index: 9000;
    }

    /* Snap guides */
    .snap-guide {
      position: absolute;
      background: var(--accent);
      opacity: 0.6;
      z-index: 8999;
      pointer-events: none;
    }

    .snap-guide.vertical {
      width: 1px;
      top: 0;
      bottom: 0;
      border-left: 1px dashed var(--accent);
      background: transparent;
    }

    .snap-guide.horizontal {
      height: 1px;
      left: 0;
      right: 0;
      border-top: 1px dashed var(--accent);
      background: transparent;
    }

    /* ---- Right Sidebar ---- */
    .right-sidebar {
      grid-area: right-sidebar;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .properties-panel {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .prop-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prop-group-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    .prop-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prop-row label {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 28px;
      flex-shrink: 0;
    }

    .prop-row .input,
    .prop-row .select {
      flex: 1;
      padding: 4px 8px;
      font-size: 0.8rem;
      min-width: 0;
    }

    .prop-row input[type="number"] {
      width: 60px;
      flex: 0 0 60px;
    }

    .prop-row input[type="color"] {
      width: 32px;
      height: 28px;
      padding: 2px;
      cursor: pointer;
      flex: 0 0 32px;
    }

    .no-selection-msg {
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
      padding: 40px 16px;
    }

    /* Preview section */
    .preview-section {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    /* Overlay link section */
    .overlay-link-section {
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .overlay-link-url {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .overlay-link-url-text {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
      background: var(--card-bg);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .overlay-link-actions {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }

    .overlay-link-actions .btn {
      flex: 1;
      font-size: 0.7rem;
      padding: 4px 8px;
    }

    /* ---- Bottom Layer Panel ---- */
    .layer-panel {
      grid-area: layers;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .layer-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .layer-panel-header h3 {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .layer-list {
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      padding: 8px;
      gap: 6px;
      flex: 1;
      align-items: flex-start;
    }

    .layer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-width: 120px;
      max-width: 160px;
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .layer-item:hover { border-color: var(--border-light); }
    .layer-item.selected { border-color: var(--accent); background: var(--accent-light); }

    .layer-item.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light);
    }

    .layer-preview {
      width: 100%;
      height: 50px;
      background: var(--surface-alt);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .layer-info {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .layer-name {
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .layer-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .layer-ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      font-size: 0.8rem;
      border-radius: var(--radius-sm);
      line-height: 1;
    }

    .layer-ctrl-btn:hover { color: var(--text); }
    .layer-ctrl-btn.off { color: var(--text-dim); opacity: 0.5; }
  </style>
</head>
<body>
  <div class="builder-layout">

    <!-- Top Toolbar -->
    <div class="builder-toolbar">
      <div class="toolbar-left">
        <a href="/dashboard" class="btn btn-sm" title="Back to Dashboard">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11 1L4 8l7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Dashboard
        </a>
        <a href="/drivers" class="btn btn-sm">Drivers</a>
        <a href="/simulator" class="btn btn-sm">Simulator</a>
        <div class="toolbar-separator"></div>
        <input type="text" class="template-name-input" id="templateName" value="Untitled Template" spellcheck="false" />
        <select class="select" id="templateType" style="font-size:0.8rem; padding:4px 8px;">
          <option value="leaderboard">Leaderboard</option>
          <option value="driver_card">Driver Card</option>
          <option value="ticker">Ticker</option>
          <option value="lbar">L-Bar</option>
          <option value="bug">Bug</option>
          <option value="fullscreen">Fullscreen</option>
          <option value="custom" selected>Custom</option>
        </select>
      </div>
      <div class="toolbar-center">
        <button class="btn btn-sm btn-icon" id="btnUndo" title="Undo (Ctrl+Z)" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h7a4 4 0 0 1 0 8H8"/><path d="M6 4L3 7l3 3"/></svg>
        </button>
        <button class="btn btn-sm btn-icon" id="btnRedo" title="Redo (Ctrl+Shift+Z)" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7H6a4 4 0 0 0 0 8h2"/><path d="M10 4l3 3-3 3"/></svg>
        </button>
        <div class="toolbar-separator"></div>
        <button class="btn btn-sm btn-icon" id="btnZoomOut" title="Zoom Out">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M5 7h4"/><path d="M11 11l3.5 3.5"/></svg>
        </button>
        <span class="zoom-display" id="zoomDisplay">100%</span>
        <button class="btn btn-sm btn-icon" id="btnZoomIn" title="Zoom In">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M5 7h4M7 5v4"/><path d="M11 11l3.5 3.5"/></svg>
        </button>
        <button class="btn btn-sm" id="btnZoomFit" title="Fit to View">Fit</button>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-sm btn-primary" id="btnSave" title="Save (Ctrl+S)">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13 16H3a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h8l4 4v9a2 2 0 0 1-2 2z"/><path d="M12 16v-5H4v5"/><path d="M4 1v4h5"/></svg>
          Save
        </button>
      </div>
    </div>

    <!-- Left Sidebar -->
    <div class="left-sidebar">
      <div class="sidebar-section" id="toolsPanel">
        <div class="sidebar-section-title">Tools</div>
        <div class="tools-grid" id="toolsGrid">
          <!-- Populated by tools-panel.js -->
        </div>
      </div>
      <div class="template-list-container" id="templateListContainer">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Templates</div>
        </div>
        <div id="templateList">
          <!-- Populated by template-manager.js -->
        </div>
      </div>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrapper" id="canvasWrapper">
        <div class="canvas-container" id="canvasContainer">
          <!-- Elements rendered here -->
        </div>
      </div>
    </div>

    <!-- Right Sidebar -->
    <div class="right-sidebar">
      <div class="properties-panel" id="propertiesPanel">
        <div class="no-selection-msg">Select an element to view its properties</div>
      </div>
      <div class="preview-section" id="previewSection">
        <!-- Preview controls populated by preview-panel.js -->
      </div>
      <div class="overlay-link-section" id="overlayLinkSection" style="display:none;">
        <div class="sidebar-section-title">Overlay Link</div>
        <div class="overlay-link-url">
          <span class="overlay-link-url-text" id="overlayLinkUrl" title=""></span>
        </div>
        <div class="overlay-link-actions">
          <button class="btn btn-sm btn-primary" id="overlayLinkCopy">Copy URL</button>
          <a class="btn btn-sm" id="overlayLinkOpen" href="#" target="_blank" rel="noopener">Open</a>
        </div>
      </div>
    </div>

    <!-- Bottom Layer Panel -->
    <div class="layer-panel">
      <div class="layer-panel-header">
        <h3>Layers</h3>
        <div class="flex gap-xs">
          <button class="btn btn-sm btn-icon" id="btnGroupLayers" title="Group (Ctrl+G)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M7 4h2m0 0v2m0-2V2m4 5v2m0 0h2m-2 0H9"/></svg>
          </button>
          <button class="btn btn-sm btn-icon" id="btnUngroupLayers" title="Ungroup (Ctrl+Shift+G)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 4h4m-4 4h4"/></svg>
          </button>
        </div>
      </div>
      <div class="layer-list" id="layerList">
        <!-- Populated by layer-panel.js -->
      </div>
    </div>

  </div>

  <script type="module" src="/js/builder/main.js"></script>
</body>
</html>
