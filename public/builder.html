<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Builder - IndyCar Telemetry</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* ================================================================ *
     *  Layout — 3-row grid (toolbar + content + timeline)
     * ================================================================ */
    .builder-layout {
      display: grid;
      grid-template-rows: 48px 1fr auto;
      grid-template-columns: 240px 1fr 280px;
      grid-template-areas:
        "toolbar toolbar toolbar"
        "left-sidebar canvas right-sidebar"
        "timeline timeline timeline";
      height: 100vh;
      width: 100vw;
    }

    /* ================================================================ *
     *  Top Toolbar
     * ================================================================ */
    .builder-toolbar {
      grid-area: toolbar;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .builder-toolbar .toolbar-left,
    .builder-toolbar .toolbar-center,
    .builder-toolbar .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .builder-toolbar .toolbar-left { flex: 0 0 auto; }
    .builder-toolbar .toolbar-center { flex: 1 1 auto; justify-content: center; }
    .builder-toolbar .toolbar-right { flex: 0 0 auto; }

    .toolbar-separator {
      width: 1px;
      height: 24px;
      background: var(--border);
    }

    #btnSnap.active {
      background: var(--accent);
      color: #fff;
    }

    .template-name-input {
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 4px 8px;
      min-width: 180px;
      text-align: center;
    }

    .template-name-input:hover { border-color: var(--border); }
    .template-name-input:focus { border-color: var(--accent); outline: none; }

    .zoom-display {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 48px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ================================================================ *
     *  Left Sidebar — Tools + Layers (vertical)
     * ================================================================ */
    .left-sidebar {
      grid-area: left-sidebar;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 12px;
    }

    .sidebar-section-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Tool buttons */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 1.1rem;
    }

    .tool-btn:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    .tool-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tool-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ---- Layer Section (vertical list in left sidebar) ---- */
    .layer-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
      overflow: hidden;
    }

    .layer-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      flex-shrink: 0;
    }

    .layer-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .layer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px 5px 4px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
      font-size: 0.8rem;
    }

    .layer-item:hover { background: var(--surface-alt); }
    .layer-item.selected { background: var(--accent-light); }

    .layer-item.drag-over {
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .layer-item.dragging {
      opacity: 0.4;
    }

    .layer-drag-handle {
      cursor: grab;
      color: var(--text-dim);
      flex-shrink: 0;
      padding: 0 2px;
      font-size: 0.7rem;
      user-select: none;
      line-height: 1;
    }

    .layer-type-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-dim);
      background: var(--surface-alt);
      border-radius: 3px;
    }

    .layer-type-icon svg {
      width: 12px;
      height: 12px;
    }

    .layer-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .layer-name-input {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--text);
      font-size: inherit;
      padding: 1px 4px;
      border-radius: 2px;
      width: 100%;
      outline: none;
    }

    .layer-badges {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .layer-anim-badge {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .layer-ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      font-size: 0.8rem;
      border-radius: var(--radius-sm);
      line-height: 1;
      flex-shrink: 0;
    }

    .layer-ctrl-btn:hover { color: var(--text); }
    .layer-ctrl-btn.off { color: var(--text-dim); opacity: 0.4; }

    /* Group folder rows */
    .layer-group-row {
      background: var(--surface-alt);
      font-weight: 600;
    }

    .layer-group-row:hover {
      background: var(--surface-hover, var(--surface-alt));
    }

    .layer-group-chevron {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 2px;
    }

    .layer-group-chevron:hover {
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    .layer-group-children {
      /* Collapsible container for child nodes inside a group */
    }

    /* ================================================================ *
     *  Canvas Area
     * ================================================================ */
    .canvas-area {
      grid-area: canvas;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--deep-space);
      position: relative;
    }

    .canvas-wrapper {
      position: relative;
    }

    .canvas-container {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: visible;
      /* Checkerboard transparency pattern */
      background-image:
        linear-gradient(45deg, #1a1a2e 25%, transparent 25%),
        linear-gradient(-45deg, #1a1a2e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1a1a2e 75%),
        linear-gradient(-45deg, transparent 75%, #1a1a2e 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-color: #12121e;
    }

    /* Frame boundary overlay: dims everything outside the canvas, preserves visible border */
    .canvas-container::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.25);
      pointer-events: none;
      z-index: 10000;
    }

    /* Canvas element base */
    .canvas-element {
      position: absolute;
      cursor: move;
      user-select: none;
    }

    .canvas-element.locked {
      cursor: default;
      pointer-events: none;
    }

    .canvas-element.hidden-element {
      opacity: 0.25 !important;
    }

    /* Selection handles */
    .selection-outline {
      position: absolute;
      border: 2px solid var(--accent);
      pointer-events: none;
      z-index: 9000;
    }

    .selection-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      border: 2px solid var(--accent);
      border-radius: 2px;
      z-index: 9001;
      cursor: pointer;
      pointer-events: all;
    }

    .selection-handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
    .selection-handle.n  { top: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
    .selection-handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
    .selection-handle.e  { top: 50%; margin-top: -5px; right: -5px; cursor: ew-resize; }
    .selection-handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }
    .selection-handle.s  { bottom: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
    .selection-handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
    .selection-handle.w  { top: 50%; margin-top: -5px; left: -5px; cursor: ew-resize; }

    .rotation-handle {
      position: absolute;
      top: -28px;
      left: 50%;
      margin-left: -7px;
      width: 14px;
      height: 14px;
      background: white;
      border: 2px solid var(--accent);
      border-radius: 50%;
      z-index: 9001;
      cursor: grab;
      pointer-events: all;
    }

    .rotation-line {
      position: absolute;
      top: -16px;
      left: 50%;
      width: 2px;
      height: 16px;
      background: var(--accent);
      margin-left: -1px;
      pointer-events: none;
      z-index: 9000;
    }

    /* Snap guides */
    .snap-guide {
      position: absolute;
      background: var(--accent);
      opacity: 0.6;
      z-index: 8999;
      pointer-events: none;
    }

    .snap-guide.vertical {
      width: 1px;
      top: 0;
      bottom: 0;
      border-left: 1px dashed var(--accent);
      background: transparent;
    }

    .snap-guide.horizontal {
      height: 1px;
      left: 0;
      right: 0;
      border-top: 1px dashed var(--accent);
      background: transparent;
    }

    /* ================================================================ *
     *  Right Sidebar
     * ================================================================ */
    .right-sidebar {
      grid-area: right-sidebar;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .properties-panel {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .prop-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prop-group-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    .prop-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prop-row label {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 28px;
      flex-shrink: 0;
    }

    .prop-row .input,
    .prop-row .select {
      flex: 1;
      padding: 4px 8px;
      font-size: 0.8rem;
      min-width: 0;
    }

    .prop-row input[type="number"] {
      width: 60px;
      flex: 0 0 60px;
    }

    .prop-row input[type="color"] {
      width: 32px;
      height: 28px;
      padding: 2px;
      cursor: pointer;
      flex: 0 0 32px;
    }

    .no-selection-msg {
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
      padding: 40px 16px;
    }

    /* ---- Collapsible Property Groups ---- */
    .prop-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .prop-group-header .prop-group-title {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .prop-group-chevron {
      font-size: 0.55rem;
      color: var(--text-dim);
      transition: transform 0.2s;
    }

    .prop-group-header.collapsed .prop-group-chevron {
      transform: rotate(-90deg);
    }

    .prop-group-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
    }

    .prop-group-body.collapsed {
      display: none;
    }

    /* ---- Quick Actions Bar ---- */
    .quick-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .quick-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 0.85rem;
    }

    .quick-action-btn:hover {
      background: var(--surface-alt);
      color: var(--text);
      border-color: var(--border);
    }

    .quick-action-btn:active { transform: scale(0.95); }
    .quick-action-btn.danger:hover { color: var(--danger); }

    .quick-action-btn svg {
      width: 14px;
      height: 14px;
    }

    /* ---- Color Swatch ---- */
    .color-swatch-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ---- Range Slider ---- */
    .prop-range-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .prop-range-wrapper input[type="range"] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }

    .prop-range-wrapper input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .prop-range-value {
      font-size: 0.7rem;
      color: var(--text-muted);
      min-width: 44px;
      flex-shrink: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Animation Controls ---- */
    .anim-preview-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 8px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: all var(--transition);
      font-size: 0.7rem;
    }

    .anim-preview-btn:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Preview section */
    .preview-section {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    /* ================================================================ *
     *  Context Menu
     * ================================================================ */
    .context-menu {
      position: fixed;
      z-index: 10000;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      min-width: 200px;
      padding: 4px 0;
      font-size: 0.8rem;
    }

    .context-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--text);
      transition: background var(--transition);
    }

    .context-menu-item:hover { background: var(--accent-light); }
    .context-menu-item.danger:hover { background: rgba(239,68,68,0.15); color: var(--danger); }

    .context-menu-shortcut {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-left: 16px;
    }

    .context-menu-separator {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* ================================================================ *
     *  Data Preset Picker
     * ================================================================ */
    .preset-picker-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 500;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preset-picker {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 640px;
      max-height: 80%;
      overflow-y: auto;
      padding: 20px;
    }

    .preset-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .preset-picker-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .preset-category-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 16px 0 8px;
    }

    .preset-category-title:first-of-type { margin-top: 0; }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .preset-card {
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
    }

    .preset-card:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .preset-card-name {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .preset-card-desc {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .preset-custom-link {
      display: block;
      text-align: center;
      padding: 10px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 12px;
      border-top: 1px solid var(--border);
    }

    .preset-custom-link:hover { color: var(--accent); }

    /* ================================================================ *
     *  Timeline Panel — Unified IN / HOLD / OUT
     * ================================================================ */
    .tl-panel {
      grid-area: timeline;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 220px;
      overflow: hidden;
      transition: max-height 0.2s ease;
    }

    .tl-panel.collapsed {
      max-height: 32px;
    }

    /* Header */
    .tl-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      height: 32px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .tl-header-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .tl-header-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 8px;
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all var(--transition);
    }

    .tl-header-btn:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    .tl-header-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .tl-header-btn svg { width: 10px; height: 10px; }

    .tl-btn-take-on {
      border-color: #4caf50;
      color: #4caf50;
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.04em;
    }
    .tl-btn-take-on:hover:not(:disabled) {
      background: rgba(76, 175, 80, 0.15);
      border-color: #4caf50;
      color: #4caf50;
    }

    .tl-btn-resume {
      border-color: #2196f3;
      color: #2196f3;
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.04em;
    }
    .tl-btn-resume:hover {
      background: rgba(33, 150, 243, 0.15);
      border-color: #2196f3;
      color: #2196f3;
    }

    .tl-btn-take-off {
      border-color: #f44336;
      color: #f44336;
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.04em;
    }
    .tl-btn-take-off:hover:not(:disabled) {
      background: rgba(244, 67, 54, 0.15);
      border-color: #f44336;
      color: #f44336;
    }

    .tl-btn-go-hold {
      border-color: #ff9800;
      color: #ff9800;
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.04em;
    }
    .tl-btn-go-hold:hover:not(:disabled) {
      background: rgba(255, 152, 0, 0.15);
      border-color: #ff9800;
      color: #ff9800;
    }

    .tl-hold-control {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 4px;
    }

    .tl-hold-control label {
      font-size: 0.65rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .tl-hold-control select {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.7rem;
      padding: 1px 4px;
      cursor: pointer;
    }

    .tl-toggle-btn {
      margin-left: auto;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.6rem;
      padding: 2px 6px;
    }

    /* Ruler + Phase Labels */
    .tl-ruler {
      position: relative;
      height: 22px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow: hidden;
    }

    .tl-ruler-labels {
      width: 90px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 6px;
      font-size: 0.6rem;
      color: var(--text-dim);
    }

    .tl-ruler-track {
      flex: 1;
      position: relative;
      display: flex;
      cursor: pointer;
    }

    .tl-phase-ruler {
      position: relative;
      overflow: hidden;
    }

    .tl-phase-ruler.in { background: rgba(76, 175, 80, 0.05); }
    .tl-phase-ruler.hold { background: rgba(255, 193, 7, 0.08); }
    .tl-phase-ruler.out { background: rgba(244, 67, 54, 0.05); }

    .tl-phase-label {
      position: absolute;
      top: 1px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      opacity: 0.7;
      pointer-events: none;
    }

    .tl-tick {
      position: absolute;
      top: 10px;
      font-size: 0.55rem;
      color: var(--text-dim);
      border-left: 1px solid rgba(255,255,255,0.08);
      padding: 0 3px;
      line-height: 1;
      white-space: nowrap;
    }

    .tl-separator {
      width: 2px;
      flex-shrink: 0;
      background: var(--border);
      position: relative;
    }

    .tl-separator::after {
      content: '';
      position: absolute;
      top: 0;
      left: -1px;
      width: 4px;
      height: 100%;
      background: var(--text-dim);
      opacity: 0.3;
    }

    /* Body / Tracks */
    .tl-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    .tl-tracks {
      position: relative;
    }

    .tl-track {
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      height: 24px;
    }

    .tl-track-label {
      width: 90px;
      flex-shrink: 0;
      padding: 0 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      line-height: 24px;
    }

    .tl-track-label:hover { color: var(--text); }

    .tl-track-phases {
      flex: 1;
      display: flex;
      height: 100%;
    }

    .tl-track-phase {
      position: relative;
      height: 100%;
    }

    .tl-track-phase.in { background: rgba(76, 175, 80, 0.03); }
    .tl-track-phase.hold { background: rgba(255, 193, 7, 0.04); }
    .tl-track-phase.out { background: rgba(244, 67, 54, 0.03); }

    .tl-track-sep {
      width: 2px;
      flex-shrink: 0;
      background: var(--border);
    }

    /* Bars */
    .tl-bar {
      position: absolute;
      top: 3px;
      height: 18px;
      border-radius: 3px;
      opacity: 0.7;
      cursor: grab;
      display: flex;
      align-items: center;
      overflow: hidden;
      transition: opacity 0.15s;
      min-width: 8px;
    }

    .tl-bar.enter { background: #4caf50; }
    .tl-bar.exit { background: #f44336; }

    .tl-bar:hover { opacity: 1; }

    .tl-bar.dragging,
    .tl-bar.resizing {
      opacity: 1;
      cursor: grabbing;
    }

    .tl-bar-label {
      font-size: 0.55rem;
      color: #fff;
      padding: 0 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .tl-bar-resize {
      position: absolute;
      right: 0;
      top: 0;
      width: 6px;
      height: 100%;
      cursor: ew-resize;
      background: rgba(255,255,255,0.2);
      border-radius: 0 3px 3px 0;
    }

    .tl-bar-resize:hover {
      background: rgba(255,255,255,0.4);
    }

    /* Playhead */
    .tl-playhead {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      background: #ff1744;
      z-index: 10;
      pointer-events: none;
      display: none;
    }

    .tl-playhead.active { display: block; }

    .tl-playhead::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      width: 10px;
      height: 10px;
      background: #ff1744;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
    }

    /* Pause Points */
    .tl-pause-point {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      border-left: 2px dashed rgba(255, 193, 7, 0.6);
      cursor: ew-resize;
      z-index: 5;
    }

    .tl-pause-point:hover {
      border-left-color: #ffc107;
    }

    .tl-pause-point-label {
      position: absolute;
      top: -14px;
      left: -10px;
      font-size: 0.5rem;
      color: #ffc107;
      white-space: nowrap;
      pointer-events: none;
    }

    .tl-pause-point-delete {
      position: absolute;
      top: -15px;
      left: 16px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 193, 7, 0.4);
      background: var(--surface);
      color: #ffc107;
      font-size: 0.65rem;
      line-height: 14px;
      text-align: center;
      cursor: pointer;
      display: none;
      padding: 0;
    }

    .tl-pause-point:hover .tl-pause-point-delete {
      display: block;
    }

    .tl-pause-point-delete:hover {
      background: rgba(255, 193, 7, 0.2);
      border-color: #ffc107;
    }

    /* Loop Region */
    .tl-loop-region {
      position: absolute;
      top: 0;
      height: 100%;
      background: rgba(33, 150, 243, 0.08);
      border-left: 2px solid rgba(33, 150, 243, 0.5);
      border-right: 2px solid rgba(33, 150, 243, 0.5);
      z-index: 3;
      pointer-events: none;
    }

    /* Empty state */
    .tl-empty {
      padding: 8px 12px;
      font-size: 0.75rem;
      color: var(--text-dim);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="builder-layout">

    <!-- Top Toolbar -->
    <div class="builder-toolbar">
      <div class="toolbar-left">
        <a href="/templates" class="btn btn-sm" title="Back to Templates">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11 1L4 8l7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Templates
        </a>
        <div class="toolbar-separator"></div>
        <input type="text" class="template-name-input" id="templateName" value="Untitled Template" spellcheck="false" />
        <select class="select" id="templateType" style="font-size:0.8rem; padding:4px 8px;">
          <option value="leaderboard">Leaderboard</option>
          <option value="driver_card">Driver Card</option>
          <option value="ticker">Ticker</option>
          <option value="lbar">L-Bar</option>
          <option value="bug">Bug</option>
          <option value="fullscreen">Fullscreen</option>
          <option value="custom" selected>Custom</option>
        </select>
      </div>
      <div class="toolbar-center">
        <button class="btn btn-sm btn-icon" id="btnUndo" title="Undo (Ctrl+Z)" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h7a4 4 0 0 1 0 8H8"/><path d="M6 4L3 7l3 3"/></svg>
        </button>
        <button class="btn btn-sm btn-icon" id="btnRedo" title="Redo (Ctrl+Shift+Z)" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7H6a4 4 0 0 0 0 8h2"/><path d="M10 4l3 3-3 3"/></svg>
        </button>
        <div class="toolbar-separator"></div>
        <button class="btn btn-sm btn-icon" id="btnZoomOut" title="Zoom Out">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M5 7h4"/><path d="M11 11l3.5 3.5"/></svg>
        </button>
        <span class="zoom-display" id="zoomDisplay">100%</span>
        <button class="btn btn-sm btn-icon" id="btnZoomIn" title="Zoom In">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M5 7h4M7 5v4"/><path d="M11 11l3.5 3.5"/></svg>
        </button>
        <button class="btn btn-sm" id="btnZoomFit" title="Fit to View">Fit</button>
        <div class="toolbar-separator"></div>
        <button class="btn btn-sm btn-icon active" id="btnSnap" title="Toggle Snapping">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4"/></svg>
        </button>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-sm btn-primary" id="btnSave" title="Save (Ctrl+S)">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13 16H3a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h8l4 4v9a2 2 0 0 1-2 2z"/><path d="M12 16v-5H4v5"/><path d="M4 1v4h5"/></svg>
          Save
        </button>
      </div>
    </div>

    <!-- Left Sidebar: Tools + Layers -->
    <div class="left-sidebar">
      <div class="sidebar-section" id="toolsPanel">
        <div class="sidebar-section-title">Tools</div>
        <div class="tools-grid" id="toolsGrid">
          <!-- Populated by tools-panel.js -->
        </div>
      </div>

      <div class="layer-section" id="layerSection">
        <div class="layer-section-header">
          <span class="sidebar-section-title" style="margin-bottom:0">Layers</span>
          <div class="flex gap-xs">
            <button class="btn btn-sm btn-icon" id="btnGroupLayers" title="Group (Ctrl+G)">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M7 4h2m0 0v2m0-2V2m4 5v2m0 0h2m-2 0H9"/></svg>
            </button>
            <button class="btn btn-sm btn-icon" id="btnUngroupLayers" title="Ungroup (Ctrl+Shift+G)">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 4h4m-4 4h4"/></svg>
            </button>
          </div>
        </div>
        <div class="layer-list" id="layerList">
          <!-- Populated by layer-panel.js -->
        </div>
      </div>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrapper" id="canvasWrapper">
        <div class="canvas-container" id="canvasContainer">
          <!-- Elements rendered here -->
        </div>
      </div>
    </div>

    <!-- Right Sidebar -->
    <div class="right-sidebar">
      <div class="properties-panel" id="propertiesPanel">
        <div class="no-selection-msg">Select an element to view its properties</div>
      </div>
      <div class="preview-section" id="previewSection">
        <!-- Preview controls populated by preview-panel.js -->
      </div>
    </div>

    <!-- Timeline Panel -->
    <div class="tl-panel collapsed" id="timelinePanel">
      <div class="tl-header">
        <span class="tl-header-title">Timeline</span>
        <button class="tl-header-btn tl-btn-take-on" id="tlTakeOnBtn" title="Take On — play IN animations">TAKE ON</button>
        <button class="tl-header-btn tl-btn-resume" id="tlResumeBtn" title="Resume past pause point" style="display:none">RESUME</button>
        <button class="tl-header-btn tl-btn-take-off" id="tlTakeOffBtn" title="Take Off — play OUT animations" style="opacity:0.4" disabled>TAKE OFF</button>
        <button class="tl-header-btn tl-btn-go-hold" id="tlGoHoldBtn" title="Skip IN — jump straight to HOLD">GO TO HOLD</button>
        <button class="tl-header-btn" id="tlLoopBtn" title="Toggle loop">&#8635; Loop</button>
        <button class="tl-header-btn" id="tlAddPauseBtn" title="Add pause point">+ Pause</button>
        <div class="tl-hold-control">
          <label>Hold</label>
          <select id="tlHoldSelect">
            <option value="0">Manual</option>
            <option value="3000">3s</option>
            <option value="5000" selected>5s</option>
            <option value="10000">10s</option>
            <option value="15000">15s</option>
            <option value="30000">30s</option>
          </select>
        </div>
        <button class="tl-toggle-btn" id="tlToggleBtn" title="Toggle timeline panel">&#9650;</button>
      </div>
      <div class="tl-ruler" id="tlRuler">
        <div class="tl-ruler-labels">Phases</div>
        <div class="tl-ruler-track" id="tlRulerTrack">
          <!-- Populated by JS -->
        </div>
      </div>
      <div class="tl-body" id="tlBody">
        <div class="tl-tracks" id="tlTracks">
          <!-- Populated by JS -->
        </div>
        <div class="tl-playhead" id="tlPlayhead"></div>
      </div>
    </div>

  </div>

  <!-- Context Menu (positioned by JS) -->
  <div class="context-menu" id="layerContextMenu" style="display:none;">
    <div class="context-menu-item" data-action="duplicate">
      <span>Duplicate</span>
      <span class="context-menu-shortcut">Ctrl+D</span>
    </div>
    <div class="context-menu-item danger" data-action="delete">
      <span>Delete</span>
      <span class="context-menu-shortcut">Del</span>
    </div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" data-action="rename">
      <span>Rename</span>
    </div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" data-action="moveToFront">
      <span>Move to Front</span>
    </div>
    <div class="context-menu-item" data-action="moveForward">
      <span>Move Forward</span>
    </div>
    <div class="context-menu-item" data-action="moveBackward">
      <span>Move Backward</span>
    </div>
    <div class="context-menu-item" data-action="moveToBack">
      <span>Move to Back</span>
    </div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" data-action="group">
      <span>Group</span>
      <span class="context-menu-shortcut">Ctrl+G</span>
    </div>
    <div class="context-menu-item" data-action="ungroup">
      <span>Ungroup</span>
      <span class="context-menu-shortcut">Ctrl+Shift+G</span>
    </div>
  </div>

  <script src="/js/vendor/gsap.min.js"></script>
  <script type="module">
    // Register motorsport easings before builder modules load
    import { registerMotorsportEasings } from '/js/shared/motorsport-easings.js';
    registerMotorsportEasings();
  </script>
  <script type="module" src="/js/builder/main.js"></script>
</body>
</html>
